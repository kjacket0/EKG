<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rhythm Venn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: ECG-paper page (8px small box, 40px large box). Tabs, then picker, Venn, region list, rate ruler, tell-apart cards. */
:root{
  --bg:#fbf8f7; --gm:rgba(205,70,95,.07); --gM:rgba(205,70,95,.15);
  --surface:#ffffff; --surface2:#f4eeed; --fg:#2a1d20; --muted:#6f5f63; --line:#e1d2d3;
  --trace:#d63a4d; --sa:#0b8f8c; --sb:#7c4dd8; --sc:#d99500; --sd:#2f6fdf; --se:#d12d8a; --sf:#4a9b3a;
  --zb:rgba(60,130,220,.10); --zn:rgba(60,170,110,.13); --zt:rgba(230,120,40,.11);
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:Barlow,'Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09110f; --gm:rgba(80,230,170,.05); --gM:rgba(80,230,170,.11);
  --surface:#101b18; --surface2:#172622; --fg:#e2f2ec; --muted:#8aa399; --line:#25392f;
  --trace:#ff6b78; --sa:#3ad8d0; --sb:#b69cff; --sc:#f6c24f; --sd:#6fa4ff; --se:#ff7cc0; --sf:#8fd97a;
  --zb:rgba(90,160,255,.12); --zn:rgba(70,200,130,.13); --zt:rgba(255,150,70,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09110f; --gm:rgba(80,230,170,.05); --gM:rgba(80,230,170,.11);
  --surface:#101b18; --surface2:#172622; --fg:#e2f2ec; --muted:#8aa399; --line:#25392f;
  --trace:#ff6b78; --sa:#3ad8d0; --sb:#b69cff; --sc:#f6c24f; --sd:#6fa4ff; --se:#ff7cc0; --sf:#8fd97a;
  --zb:rgba(90,160,255,.12); --zn:rgba(70,200,130,.13); --zt:rgba(255,150,70,.12); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 var(--body);color:var(--fg);background-color:var(--bg);
  background-image:linear-gradient(var(--gm) 1px,transparent 1px),linear-gradient(90deg,var(--gm) 1px,transparent 1px),linear-gradient(var(--gM) 1px,transparent 1px),linear-gradient(90deg,var(--gM) 1px,transparent 1px);
  background-size:8px 8px,8px 8px,40px 40px,40px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 clamp(34px,8vw,52px)/.95 var(--display);letter-spacing:.02em;text-transform:uppercase}
.sub{margin:4px 0 0;color:var(--muted);max-width:52ch}
.trace{width:150px;height:44px;flex:none}
.trace path{fill:none;stroke:var(--trace);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.steps{display:flex;gap:6px;flex-wrap:wrap;font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps span{border:1px solid var(--line);background:var(--surface);padding:2px 8px;border-radius:4px}
.steps b{font-family:var(--mono);color:var(--fg);margin-right:5px;font-weight:500}
.tabs{display:flex;gap:8px}
.tab{flex:1;max-width:240px;padding:9px 12px;border:1.5px solid var(--fg);background:var(--surface);border-radius:6px;font:700 18px var(--display);letter-spacing:.05em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tab small{font:500 12px var(--mono);margin-left:6px;opacity:.8}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.card h2{margin:0 0 8px;font:700 20px var(--display);letter-spacing:.04em;text-transform:uppercase}
.lbl{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--fg)}
.chip.dim{opacity:.4}
.chip .n{font:500 11px var(--mono);color:var(--muted)}
.sw{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.s0{background:var(--sa)}.s1{background:var(--sb)}.s2{background:var(--sc)}.s3{background:var(--sd)}.s4{background:var(--se)}.s5{background:var(--sf)}
.preset{border:1px dashed var(--muted);background:transparent;border-radius:6px;padding:4px 10px;font-weight:500;font-size:14px}
.grp{border:0;background:transparent;padding:4px 2px;margin-right:10px;font:600 15px var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.grp[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--trace)}
.slots .chip{background:var(--surface);border-color:var(--fg);padding-right:6px}
.slots .x{border:0;background:transparent;font-size:16px;line-height:1;padding:2px 6px;color:var(--muted)}
.venn{width:100%;overflow:hidden}
.venn svg{display:block;margin:0 auto;max-width:100%}
.venn text{font-family:var(--body);fill:var(--fg)}
.venn .nm{font:700 17px var(--display);letter-spacing:.04em;text-transform:uppercase}
.circ{fill-opacity:.17;stroke-width:2.2}
.c0{fill:var(--sa);stroke:var(--sa)}.c1{fill:var(--sb);stroke:var(--sb)}.c2{fill:var(--sc);stroke:var(--sc)}.c3{fill:var(--sd);stroke:var(--sd)}.c4{fill:var(--se);stroke:var(--se)}.c5{fill:var(--sf);stroke:var(--sf)}
.venn .bdg{fill:var(--bg);font:700 12px var(--mono)}.venn .cnt{font:700 14px var(--mono);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:6px;font-weight:600;font-size:14px}
.lg{display:inline-flex;align-items:center;gap:5px}.lg b,.num{font:500 11px var(--mono);color:var(--muted)}
.reg.nd{border-style:dashed}
.pair summary .sum-r{font:700 17px var(--display);letter-spacing:.04em;text-transform:uppercase}
.hint{color:var(--muted);font-size:14px;margin:0}
.regs{display:flex;gap:6px;flex-wrap:wrap}
.reg{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:7px;font-weight:600}
.reg[aria-pressed="true"]{border-color:var(--fg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--fg)}
.reg .n{font:500 12px var(--mono);color:var(--muted)}
.reg .dots{display:flex;gap:2px}
ul.at{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
ul.at li{display:flex;gap:8px;align-items:baseline}
.pill{font:500 10.5px var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 5px;min-width:38px;text-align:center;flex:none;color:var(--muted)}
.ruler svg{display:block;width:100%}
.ruler text{font-family:var(--body);fill:var(--fg);font-size:12.5px}
.ruler .ax{font:500 10.5px var(--mono);fill:var(--muted)}
.ovl{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-weight:500}
.ovl li::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;background:var(--trace);opacity:.55;border-radius:2px}
.pair{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:10px 12px}
.pair+.pair{margin-top:8px}
.pair h3{margin:0 0 4px;font:700 18px var(--display);letter-spacing:.04em;text-transform:uppercase}
.tip{margin:0 0 8px;font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:5px 8px;border-top:1px solid var(--line)}
th{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.k{white-space:nowrap;font-weight:600}
details{border-top:1px solid var(--line);padding:8px 0}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--muted)}
details[open]>summary::before{content:"▾"}
.sum-r{flex:1;min-width:0}
.tagg{font:500 10.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.mini{border:1px solid var(--fg);background:var(--surface);border-radius:5px;padding:2px 9px;font-size:13px;font-weight:600}
.mini[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.step{margin-bottom:12px}
.step h3{margin:0 0 6px;font:700 17px var(--display);letter-spacing:.05em;text-transform:uppercase}
.step h3 b{font-family:var(--mono);font-weight:500;background:var(--fg);color:var(--bg);border-radius:4px;padding:0 6px;margin-right:6px}
.step h3 i{font:400 13px var(--body);text-transform:none;letter-spacing:0;color:var(--muted);font-style:normal;margin-left:6px}
.next{border:1.5px solid var(--trace);border-radius:8px;padding:10px 12px;background:var(--surface)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.btn{border:1.5px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:6px;padding:6px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg)}
footer{color:var(--muted);font-size:13px}
@media (max-width:520px){.tab small{display:none}.trace{width:110px}}
@media (prefers-reduced-motion:no-preference){.trace path{stroke-dasharray:420;stroke-dashoffset:420;animation:dr 1.6s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}}
</style>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[
 {id:'reg',label:'Regularity',pill:'REG',q:'Regular or irregular?'},
 {id:'rate',label:'Rate',pill:'RATE',q:'How fast?'},
 {id:'p',label:'P waves',pill:'P',q:'One per QRS? Before or after? Same shape?'},
 {id:'pr',label:'PR interval',pill:'PRI',q:'Normal, long, changing?'},
 {id:'qrs',label:'QRS',pill:'QRS',q:'Narrow or wide?'},
 {id:'x',label:'Other clues',pill:'+',q:'Pauses, pacer spikes, ectopics'}];
const CAT={};CATS.forEach(c=>CAT[c.id]=c);
const ATOMS=[],A={};
function at(id,cat,short,long){const o={id,cat,short,long:long||short,i:ATOMS.length};ATOMS.push(o);A[id]=o;}
/* Regularity */
at('r_reg','reg','Regular');
at('r_slirr','reg','Slightly irregular');
at('r_irr','reg','Irregular');
at('r_grirr','reg','Grossly irregular');
at('r_regirr','reg','Regularly irregular','Regularly irregular (patterned, grouped beating)');
at('r_under','reg','Per underlying','Set by the underlying rhythm (the ectopic beat itself comes early)');
at('r_chaos','reg','Chaotic','Totally chaotic');
at('r_none','reg','Flat line','No electrical activity');
/* Rate */
at('ra_brady','rate','<60 bpm','Bradycardia, <60 bpm');
at('ra_norm','rate','60–100 bpm','Normal rate, 60–100 bpm');
at('ra_tachy','rate','>100 bpm','Tachycardia, >100 bpm');
at('ra_slow','rate','Slightly slow','Slightly slower than normal');
at('ra_under','rate','Per underlying','Rate follows the underlying rhythm');
at('ra_none','rate','No rate','No measurable rate');
at('ra_100_160','rate','100–160','Usually 100–160 bpm');
at('ra_100_180','rate','100–180','100–180 bpm');
at('ra_150_250','rate','150–250','150–250 bpm');
at('ra_150up','rate','>160','Above 160 bpm: too fast to tell the origin');
at('ra_byblock','rate','Set by block ratio','Ventricular rate depends on the conduction ratio (2:1 ≈ 150, 3:1 ≈ 100, 4:1 ≈ 75)');
at('ra_a250','rate','Atrial 250–350','Atrial rate 250–350 bpm');
at('ra_a350','rate','Atrial >350','Atrial rate >350 bpm');
at('ra_anorm','rate','Atrial 60–100','Atrial rate usually 60–100 bpm');
at('ra_40_60','rate','40–60','40–60 bpm (junctional focus)');
at('ra_20_40','rate','20–40','20–40 bpm (ventricular focus), can drop below 20');
/* P waves */
at('p_sinus','p','Upright, uniform P','Upright, uniform P waves (sinus P)');
at('p_every','p','P before each QRS','One P wave in front of every QRS');
at('p_more','p','More P than QRS','More P waves than QRS complexes (some not conducted)');
at('p_march','p','P marches through','P waves march through, unrelated to the QRS');
at('p_atrial','p','Atrial P (≠ sinus)','Atrial P wave that differs from the sinus P');
at('p_multi','p','≥3 P shapes','P-wave shape changes beat to beat (at least 3 shapes)');
at('p_fwaves','p','No P, f waves','No discernible P waves; fibrillatory (f) waves');
at('p_saw','p','Sawtooth F waves','Sawtooth flutter (F) waves');
at('p_inv','p','Inverted P','Inverted P wave (retrograde atrial activation)');
at('p_pos','p','Before, in, or after QRS','P can sit before, inside, or after the QRS');
at('p_hidden','p','P can hide','P wave can be hidden (in the QRS or lost in the T wave)');
at('p_none','p','No P wave','Not preceded by a P wave');
/* PR */
at('pr_norm','pr','PRI .12–.20','PRI .12–.20 s');
at('pr_long','pr','PRI >.20','Prolonged PRI, >.20 s');
at('pr_short','pr','PRI <.12','PRI <.12 s (measurable only if the P precedes the QRS)');
at('pr_const','pr','PRI constant','PRI constant across the strip');
at('pr_lengthen','pr','PRI lengthens, then drops','PRI lengthens until a P wave is not conducted');
at('pr_lt20','pr','PRI <.20, varies','PRI under .20 s, may vary');
at('pr_norel','pr','No P–QRS link','No relationship between P waves and QRS');
at('pr_na','pr','No PRI','PRI unmeasurable or absent');
/* QRS */
at('q_narrow','qrs','Narrow QRS','Narrow QRS, <.12 s');
at('q_wide','qrs','Wide QRS','Wide QRS, ≥.12 s');
at('q_bizarre','qrs','Bizarre, T opposite','Wide and bizarre; T wave opposite the R');
at('q_twist','qrs','Twisting QRS','QRS amplitude and direction gradually change around the baseline');
at('q_none','qrs','No QRS','No discernible QRS complexes');
/* Other */
at('x_ectopic','x','Single early beat','Single early (ectopic) beat, not a whole rhythm');
at('x_comp','x','Compensatory pause','Compensatory pause follows');
at('x_retro','x','Retrograde atria','Atria depolarize retrograde from the junction');
at('x_override','x','Irritable focus takes over','Irritable focus speeds up and overrides higher sites');
at('x_escape','x','Escape rhythm','Escape: the higher pacemaker failed, a lower site takes over');
at('x_group','x','Grouped beating','Characteristic grouped beating');
at('x_dissoc','x','AV dissociation','Atria and ventricles fully dissociated');
at('x_nonperf','x','Clinically dead','Non-perfusing rhythm; patient clinically dead');
at('x_maybepulse','x','Pulse or pulseless','Can have a pulse or be pulseless');
at('x_qt','x','Prolonged QT','Prolonged QT/QTc');
at('x_catchall','x','Catch-all label','Catch-all label when P waves are not visible and the exact rhythm is unclear');
at('x_resp','x','Follows breathing','Faster on inspiration, slower on expiration');
at('x_pause','x','Pause','Pause in sinus activity');
at('x_pause_mult','x','Pause = multiple of R–R','Pause length is a multiple of the R–R interval');
at('x_sa_fires','x','SA node still fires','SA node still depolarizes; the signal is blocked from exiting');
at('x_sa_stops','x','SA node stops','Sudden cessation of activity; SA node non-functional');
at('x_dur','x','Pause <2 s, arrest >2–3 s','Pause under 2 s; arrest over 2–3 s (course slides; many references use about 2–3 s for a pause and over 3 s for arrest)');
at('x_bp','x','BP falls','BP drops, worse as the pause lengthens');
at('x_spike','x','Pacer spike','Sharp pacemaker spike');
at('x_spike_p','x','Spike → P','Spike followed by atrial depolarization (P wave)');
at('x_spike_qrs','x','Spike → QRS','Spike followed by ventricular depolarization (QRS)');
const GROUPS=['Sinus','Atrial','Junctional','Ventricular','AV blocks','Pauses & paced'];
const R=[],RM={};
/* rr segments: [lo,hi,fadeLo,fadeHi]; rv = rate varies */
function rh(id,name,short,group,atoms,o){
  const r=Object.assign({id,name,short,group,atoms:new Set(atoms.split(' ')),rr:null,rv:false,rateText:'',note:'',src:''},o||{});
  r.atoms.forEach(a=>{if(!A[a])console.error('bad atom',id,a);});
  R.push(r);RM[id]=r;}
const JP='p_inv p_pos p_hidden pr_short q_narrow x_retro';
rh('nsr','Normal sinus rhythm','NSR','Sinus','r_reg ra_norm p_sinus p_every pr_norm pr_const q_narrow',{rr:[[60,100]],rateText:'60–100 bpm',src:'Wk 5 slides'});
rh('sbrady','Sinus bradycardia','Sinus brady','Sinus','r_reg ra_brady p_sinus p_every pr_norm pr_const q_narrow',{rr:[[0,60,1,0]],rateText:'<60 bpm',src:'Wk 5 slides'});
rh('stachy','Sinus tachycardia','Sinus tach','Sinus','r_reg ra_tachy ra_100_160 p_sinus p_every pr_norm pr_const q_narrow',{rr:[[100,160]],rateText:'>100 bpm, usually 100–160',src:'Wk 5 and Wk 7 slides'});
rh('sarr','Sinus arrhythmia','Sinus arrhythmia','Sinus','r_irr ra_norm x_resp p_sinus p_every pr_norm pr_const q_narrow',{rr:[[60,100]],rateText:'60–100 bpm (usually)',src:'Wk 5 slides'});

rh('afib','Atrial fibrillation','A-fib','Atrial','r_grirr ra_brady ra_norm ra_tachy ra_a350 p_fwaves pr_na q_narrow',{rv:true,rateText:'Ventricular rate varies: <60 SVR, 60–100 controlled, >100 RVR',note:'Atrial rate is >350. No correlation between P waves, and they may be absent.',src:'Wk 6 slides, Wk 8 and Wk 10 notes, algorithm deck'});
rh('aflutter','Atrial flutter','A-flutter','Atrial','r_reg r_irr ra_brady ra_norm ra_tachy ra_byblock ra_a250 p_saw pr_na q_narrow',{rr:[[75,250,0,1]],rateText:'Atrial 250–350; ventricular set by the block ratio (2:1 ≈ 150, 3:1 ≈ 100, 4:1 ≈ 75)',note:'Your SVT slide lists flutter at 150–250 when it shows up as a fast narrow tachycardia; 250 would need 1:1 conduction, which is rare. Irregular only with variable block ("flutter with variable conduction"). Regular flutter has a fixed conduction ratio (F waves : QRS, e.g. 4:1). The rhythm graphic says "no P wave, wide and narrow QRS"; the lecture slides say sawtooth F waves and a narrow QRS, which this page follows.',src:'Wk 6 and Wk 7 slides, Wk 8 notes, algorithm deck'});
rh('atach','Atrial tachycardia','A-tach','Atrial','r_reg ra_tachy ra_150_250 p_atrial p_hidden pr_norm q_narrow',{rr:[[150,250]],rateText:'150–250 bpm',note:'Wk 6 slides give PRI .12–.20. The algorithm deck says "likely shortened PRI". Different from multifocal atrial tachycardia.',src:'Wk 6 and Wk 7 slides, Wk 8 notes'});
rh('wap','Wandering atrial pacemaker','WAP','Atrial','r_slirr ra_norm p_multi pr_lt20 q_narrow',{rr:[[60,100]],rateText:'60–100 bpm (usually)',note:'Pacemaker site wanders between the SA node, atria and AV junction. Rate >100 makes it MAT.',src:'Wk 6 slides, Wk 8 and Wk 10 notes'});
rh('mat','Multifocal atrial tachycardia','MAT','Atrial','r_irr ra_tachy p_multi pr_lt20 q_narrow',{rr:[[100,300,0,1]],rateText:'>100 bpm',note:'Same picture as WAP, but fast. It is irregular, which is why it gets mistaken for A-fib; the P waves (one before each QRS, 3 or more shapes) tell them apart.',src:'Wk 6 slides, Wk 8 notes, algorithm deck'});
rh('pac','Premature atrial contraction','PAC','Atrial','r_under ra_under p_atrial p_hidden pr_norm pr_long q_narrow x_ectopic',{rateText:'Follows the underlying rhythm',note:'A single beat, so also name the underlying rhythm. Ectopics come from a slower (lower) site that has become irritable. The pause after a PAC is usually non-compensatory, unlike a PVC.',src:'Wk 6 slides, Wk 10 notes, algorithm deck'});

rh('pjc','Premature junctional complex','PJC','Junctional','r_under ra_under x_ectopic '+JP,{rateText:'Follows the underlying rhythm',note:'A single beat, so also name the underlying rhythm. A junctional escape rhythm cannot have a PJC: an ectopic beat cannot come from the site that is already pacemaking. PACs and PVCs can still occur.',src:'Wk 7 slides, Wk 9 and Wk 10 notes'});
rh('jescape','Junctional escape rhythm','Junctional escape','Junctional','r_reg ra_brady ra_40_60 x_escape '+JP,{rr:[[40,60]],rateText:'40–60 bpm',note:'Junctional rhythms are always regular.',src:'Wk 7 slides, Wk 10 notes'});
rh('ajr','Accelerated junctional rhythm','Accel. junctional','Junctional','r_reg ra_norm x_override '+JP,{rr:[[60,100]],rateText:'60–100 bpm',note:'Junctional rhythms are always regular.',src:'Wk 7 slides'});
rh('jtach','Junctional tachycardia','Junctional tach','Junctional','r_reg ra_tachy ra_100_180 x_override '+JP,{rr:[[100,180]],rateText:'100–180 bpm',note:'The Wk 9 notes leave this rate blank; the Wk 7 slides give 100–180.',src:'Wk 7 slides, Wk 9 notes'});

'vfib|asystole':'VF shows chaotic electrical activity. Asystole is a straight line.',

'torsades|vfib':'Torsades still has recognizable QRS complexes that twist. VF has no discernible complexes.',

function tipFor(a,b){return T[a+'|'+b]||T[b+'|'+a]||'';}
const MAX=6,SC=['sa','sb','sc','sd','se','sf'];
const mctx=document.createElement('canvas').getContext('2d');
function tw(txt,font){mctx.font=font;return mctx.measureText(txt).width;}

function geom(n,W){
  const top=46;let circles,H,labels;
  if(n===1){const r=Math.min(W*.34,170);circles=[{x:W/2,y:top+r,r}];H=top+2*r+16;labels=[{x:W/2,y:24}];}
  else if(n===2){const r=Math.min((W-24)/2.9,200),d=.9*r;
    circles=[{x:W/2-d/2,y:top+r,r},{x:W/2+d/2,y:top+r,r}];H=top+2*r+16;
    labels=[{x:circles[0].x-r*.2,y:24},{x:circles[1].x+r*.2,y:24}];}
  else if(n>3){
    const k=n===4?.6:n===5?.62:.64,t=26,ox=[],oy=[];
    for(let i=0;i<n;i++){const a=(-90+360*i/n)*Math.PI/180;ox.push(Math.cos(a));oy.push(Math.sin(a));}
    const minx=Math.min(...ox),maxx=Math.max(...ox),miny=Math.min(...oy),maxy=Math.max(...oy);
    const r=Math.min((W-60)/(k*(maxx-minx)+2),165),cx=W/2-k*r*(minx+maxx)/2;
    circles=ox.map((_,i)=>({x:cx+k*r*ox[i],y:t+r+k*r*(oy[i]-miny),r}));
    H=t+2*r+k*r*(maxy-miny)+28;labels=[];}
  else{const r=Math.min((W-24)/3.1,185),s=.55*r;
    circles=[{x:W/2-s,y:top+r,r},{x:W/2+s,y:top+r,r},{x:W/2,y:top+r+1.7*s,r}];
    H=top+r+1.7*s+r+40;
    labels=[{x:circles[0].x-r*.2,y:24},{x:circles[1].x+r*.2,y:24},{x:W/2,y:H-14}];}
  return{circles,H,labels};
}
function maskAt(cs,x,y){let m=0;for(let i=0;i<cs.length;i++){const dx=x-cs[i].x,dy=y-cs[i].y;if(dx*dx+dy*dy<cs[i].r*cs[i].r)m|=1<<i;}return m;}
function regionSpots(g,W){
  const cs=g.circles,H=g.H,step=Math.max(2,Math.round(cs[0].r/45));
  const margin=(x,y)=>{let b=1e9;for(const c of cs){const d=Math.abs(Math.hypot(x-c.x,y-c.y)-c.r);if(d<b)b=d;}return b;};
  const best={};
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){const m=maskAt(cs,x,y);if(!m)continue;const mg=margin(x,y);if(!best[m]||mg>best[m].mg)best[m]={x,y,mg};}
  const ext=(px,py,dx,dy,m)=>{let k=0;while(k<400&&maskAt(cs,px+dx*k*2,py+dy*k*2)===m)k++;return k*2;};
  const out={};
  for(const key in best){
    const m=+key;let{x,y}=best[key];
    let l=ext(x,y,-1,0,m),r=ext(x,y,1,0,m),tx=x+(r-l)/2;
    if(maskAt(cs,tx,y)!==m)tx=x;
    let u=ext(tx,y,0,-1,m),d=ext(tx,y,0,1,m),ty=y+(d-u)/2;
    if(maskAt(cs,tx,ty)!==m)ty=y;
    l=ext(tx,ty,-1,0,m);r=ext(tx,ty,1,0,m);u=ext(tx,ty,0,-1,m);d=ext(tx,ty,0,1,m);
    out[m]={x:tx,y:ty,w:l+r,h:u+d};
  }
  return out;
}
function wrap(text,maxW,font){
  const words=text.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(cur&&tw(t,font)>maxW){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}
function layoutTags(tags,w,h,fs,lh){
  const font='500 '+fs+'px Barlow, "Helvetica Neue", Arial, sans-serif';
  const maxW=Math.max(46,w-12),maxLines=Math.max(1,Math.floor((h-6)/lh));
  const blocks=tags.map(t=>wrap('• '+t,maxW,font));
  const total=blocks.reduce((s,b)=>s+b.length,0);
  if(total<=maxLines)return blocks.flat();
  const out=[];let used=0,i=0;
  for(;i<blocks.length;i++){if(used+blocks[i].length>maxLines-1)break;out.push(...blocks[i]);used+=blocks[i].length;}
  out.push('+'+(blocks.length-i)+' more');
  return out;
}
function vennSVG(sel,W,regionMap,activeMask){
  const n=sel.length;if(!n)return'';
  const g=geom(n,W),cs=g.circles;
  const fs=W<440?11.5:13,lh=fs*1.25;
  let s='<svg viewBox="0 0 '+W+' '+g.H+'" width="'+W+'" height="'+g.H+'" role="img" aria-label="Venn diagram of '+esc(sel.map(id=>RM[id].name).join(', '))+'">';
  s+='<defs>';
  if(activeMask){
    cs.forEach((c,i)=>{s+='<clipPath id="cp'+i+'"><circle cx="'+c.x+'" cy="'+c.y+'" r="'+c.r+'"/></clipPath>';});
    s+='<mask id="exm" maskUnits="userSpaceOnUse" x="0" y="0" width="'+W+'" height="'+g.H+'"><rect x="0" y="0" width="'+W+'" height="'+g.H+'" fill="#fff"/>';
    cs.forEach((c,i)=>{if(!(activeMask>>i&1))s+='<circle cx="'+c.x+'" cy="'+c.y+'" r="'+c.r+'" fill="#000"/>';});
    s+='</mask>';
  }
  s+='</defs>';
  cs.forEach((c,i)=>{s+='<circle class="circ c'+i+'" cx="'+c.x+'" cy="'+c.y+'" r="'+c.r+'"/>';});
  if(activeMask){
    let inner='<rect x="0" y="0" width="'+W+'" height="'+g.H+'" style="fill:var(--fg)" fill-opacity=".16"/>';
    cs.forEach((c,i)=>{if(activeMask>>i&1)inner='<g clip-path="url(#cp'+i+')">'+inner+'</g>';});
    s+='<g mask="url(#exm)">'+inner+'</g>';
  }
  const spots=regionSpots(g,W);
  for(const key in spots){
    const m=+key;let tags=(regionMap[m]||[]).map(a=>A[a].short);
    if(!tags.length)continue;
    if(n>3){const q=spots[m];if(q.w>=18&&q.h>=16)s+='<text class="cnt" x="'+q.x.toFixed(1)+'" y="'+(q.y+5).toFixed(1)+'" text-anchor="middle">'+tags.length+'</text>';continue;}
    if(n===3&&W<500&&tags.length>2)tags=tags.slice(0,2).concat(['+'+(tags.length-2)+' more']);
    const sh=n===3?.76:.92,sp=spots[m],lines=layoutTags(tags,sp.w*sh,sp.h*sh,fs,lh);
    const y0=sp.y-(lines.length-1)*lh/2+fs*.35;
    lines.forEach((ln,k)=>{s+='<text x="'+sp.x.toFixed(1)+'" y="'+(y0+k*lh).toFixed(1)+'" text-anchor="middle" font-size="'+fs+'" font-weight="500">'+esc(ln)+'</text>';});
  }
  if(n>3){const mx=cs.reduce((a,c)=>a+c.x,0)/n,my=cs.reduce((a,c)=>a+c.y,0)/n;
    cs.forEach((c,i)=>{let dx=c.x-mx,dy=c.y-my;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
      const bx=c.x+dx*c.r,by=c.y+dy*c.r;
      s+='<circle cx="'+bx.toFixed(1)+'" cy="'+by.toFixed(1)+'" r="10" style="fill:var(--'+SC[i]+')"/>';
      s+='<text class="bdg" x="'+bx.toFixed(1)+'" y="'+(by+4).toFixed(1)+'" text-anchor="middle">'+(i+1)+'</text>';});}
  if(n<=3)sel.forEach((id,i)=>{
    const L=g.labels[i],nm=RM[id].short;
    const w0=tw(nm.toUpperCase(),'700 17px "Barlow Condensed", Arial Narrow, sans-serif')*1.06;
    s+='<circle cx="'+(L.x+8-w0/2-10).toFixed(1)+'" cy="'+(L.y-5)+'" r="5.5" style="fill:var(--'+SC[i]+')"/>';
    s+='<text class="nm" x="'+(L.x+8).toFixed(1)+'" y="'+L.y+'" text-anchor="middle">'+esc(nm)+'</text>';
  });
  s+='</svg>';return s;
}
/* Rate ruler: one linear scale, 0 to 300 bpm */
function segLabel(sg){return sg[2]?'<'+sg[1]:(sg[3]?sg[0]+'+':(sg[0]+'–'+sg[1]));}
function overlapsOf(sel){
  const items=sel.map((id,i)=>({id,i,segs:RM[id].rr||[]})).filter(o=>o.segs.length);
  const pts=new Set([0,300]);items.forEach(o=>o.segs.forEach(s=>{pts.add(s[0]);pts.add(s[1]);}));
  const p=[...pts].sort((a,b)=>a-b),out=[];
  for(let k=0;k<p.length-1;k++){
    const lo=p[k],hi=p[k+1];
    const cov=items.filter(o=>o.segs.some(s=>s[0]<=lo&&s[1]>=hi)).map(o=>o.i);
    if(cov.length>=2){const key=cov.join();const last=out[out.length-1];
      if(last&&last.key===key&&last.hi===lo)last.hi=hi;else out.push({key,cov,lo,hi});}
  }
  return out.map(o=>{
    const open=o.hi===300&&o.cov.some(i=>(RM[sel[i]].rr||[]).some(s=>s[3]));
    const txt=open?o.lo+'+ bpm':o.lo+'–'+o.hi+' bpm';
    return{lo:o.lo,hi:o.hi,cov:o.cov,text:o.cov.map(i=>RM[sel[i]].short).join(' + ')+': '+txt};
  });
}
function rulerSVG(sel,W){
  const m=10,x=v=>m+v/300*(W-2*m),rowH=34,top=8,H=top+sel.length*rowH+34;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Heart rate ranges on a 0 to 300 bpm scale">';
  s+='<defs><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="currentColor" opacity=".35"/></pattern>';
  sel.forEach((id,i)=>{const rr=RM[id].rr||[];rr.forEach((sg,k)=>{
    const st=[];if(sg[2])st.push('<stop offset="0" stop-color="var(--'+SC[i]+')" stop-opacity="0"/><stop offset=".35" stop-color="var(--'+SC[i]+')"/>');
    else st.push('<stop offset="0" stop-color="var(--'+SC[i]+')"/>');
    if(sg[3])st.push('<stop offset=".65" stop-color="var(--'+SC[i]+')"/><stop offset="1" stop-color="var(--'+SC[i]+')" stop-opacity="0"/>');
    else st.push('<stop offset="1" stop-color="var(--'+SC[i]+')"/>');
    s+='<linearGradient id="g'+i+'_'+k+'" x1="0" x2="1" y1="0" y2="0">'+st.join('')+'</linearGradient>';});});
  s+='</defs>';
  const bh=top+sel.length*rowH;
  s+='<rect x="'+x(0)+'" y="'+top+'" width="'+(x(60)-x(0))+'" height="'+(bh-top)+'" style="fill:var(--zb)"/>';
  s+='<rect x="'+x(60)+'" y="'+top+'" width="'+(x(100)-x(60))+'" height="'+(bh-top)+'" style="fill:var(--zn)"/>';
  s+='<rect x="'+x(100)+'" y="'+top+'" width="'+(x(300)-x(100))+'" height="'+(bh-top)+'" style="fill:var(--zt)"/>';
  overlapsOf(sel).forEach(o=>{s+='<rect x="'+x(o.lo)+'" y="'+top+'" width="'+Math.max(2,x(o.hi)-x(o.lo))+'" height="'+(bh-top)+'" style="fill:var(--trace)" fill-opacity=".28"/>';});
  sel.forEach((id,i)=>{
    const r=RM[id],y=top+i*rowH,rr=r.rr||[];
    let lab=r.short;
    if(rr.length)lab+='  '+rr.map(segLabel).join(', ')+' bpm';
    else if(r.rv)lab+='  varies (see below)';
    else lab+='  no fixed rate';
    s+='<text x="'+(m+2)+'" y="'+(y+13)+'" font-weight="600">'+esc(lab)+'</text>';
    rr.forEach((sg,k)=>{s+='<rect x="'+x(sg[0])+'" y="'+(y+18)+'" width="'+Math.max(3,x(sg[1])-x(sg[0]))+'" height="10" rx="3" fill="url(#g'+i+'_'+k+')"/>';});
    if(r.rv)s+='<rect x="'+x(0)+'" y="'+(y+18)+'" width="'+(x(300)-x(0))+'" height="10" rx="3" style="color:var(--'+SC[i]+')" fill="url(#hat)"/>';
  });
  s+='<line x1="'+x(0)+'" x2="'+x(300)+'" y1="'+bh+'" y2="'+bh+'" style="stroke:var(--muted)"/>';
  [0,20,40,60,100,150,200,250,300].forEach(v=>{
    s+='<line x1="'+x(v)+'" x2="'+x(v)+'" y1="'+bh+'" y2="'+(bh+5)+'" style="stroke:var(--muted)"/>';
    const a=v===0?'start':v===300?'end':'middle';
    s+='<text class="ax" x="'+x(v)+'" y="'+(bh+17)+'" text-anchor="'+a+'">'+v+'</text>';
  });
  s+='<text class="ax" x="'+x(30)+'" y="'+(bh+30)+'" text-anchor="middle">brady</text>';
  s+='<text class="ax" x="'+x(80)+'" y="'+(bh+30)+'" text-anchor="middle">normal</text>';
  s+='<text class="ax" x="'+x(200)+'" y="'+(bh+30)+'" text-anchor="middle">tachycardia</text>';
  s+='</svg>';return s;
}
const PRESETS=[
 ['Sinus tach vs SVT',['stachy','svt']],
 ['SVT look-alikes',['stachy','atach','jtach']],
 ['A-fib · WAP · MAT',['afib','wap','mat']],
 ['Flutter · A-fib · A-tach',['aflutter','afib','atach']],
 ['PAC · PJC · PVC',['pac','pjc','pvc']],
 ['Junctional rates',['jescape','ajr','jtach']],
 ['Wenckebach · II · CHB',['wenck','mobitz2','chb']],
 ['VT · VF · Asystole',['vt','vfib','asystole']]];
const state={tab:'compare',sel:['stachy','svt'],grp:'Sinus',region:null,
  f:{reg:new Set(),rate:new Set(),p:new Set(),pr:new Set(),qrs:new Set(),x:new Set()},open:new Set()};
const app=document.getElementById('app');
let vennW=0;

function regionMap(){
  const m={},all=new Set();
  state.sel.forEach(id=>RM[id].atoms.forEach(a=>all.add(a)));
  [...all].sort((a,b)=>A[a].i-A[b].i).forEach(a=>{
    let k=0;state.sel.forEach((id,i)=>{if(RM[id].atoms.has(a))k|=1<<i;});
    (m[k]=m[k]||[]).push(a);});
  return m;
}
function regionOrder(n,rm){
  if(n<=3)return n===1?[1]:n===2?[3,1,2]:n===3?[7,3,5,6,1,2,4]:[];
  const pc=m=>{let c=0;while(m){c+=m&1;m>>=1;}return c;},ks=[];
  for(let k=1;k<(1<<n);k++)if((rm[k]||[]).length)ks.push(k);
  return ks.sort((a,b)=>pc(b)-pc(a)||a-b);
}
function rLabel(mask){
  const t=state.sel.length,inn=state.sel.filter((_,i)=>mask>>i&1).map(id=>RM[id].short),out=state.sel.filter((_,i)=>!(mask>>i&1)).map(id=>RM[id].short);
  if(t>1&&!out.length)return t===2?'Shared':'Shared by all';
  if(inn.length===1)return 'Only '+inn[0];
  if(t>3&&out.length<inn.length)return 'All except '+out.join(', ');
  return inn.join(' + ');
}
function ensureRegion(){
  const rm=regionMap(),ord=regionOrder(state.sel.length,rm);
  if(!state.region||!ord.includes(state.region))state.region=ord.find(k=>(rm[k]||[]).length)||ord[0]||null;
}
function setSel(list){state.sel=list.slice(0,MAX);state.region=null;ensureRegion();}
function pick(id){
  const i=state.sel.indexOf(id);
  if(i>=0)state.sel.splice(i,1);else{if(state.sel.length>=MAX)state.sel.shift();state.sel.push(id);}
  state.region=null;ensureRegion();
}
const pillOf=a=>'<span class="pill">'+CAT[A[a].cat].pill+'</span>';
function atomList(ids){return '<ul class="at">'+ids.map(a=>'<li>'+pillOf(a)+'<span>'+esc(A[a].long)+'</span></li>').join('')+'</ul>';}
function dotsFor(mask){return '<span class="dots">'+state.sel.map((_,i)=>mask>>i&1?'<span class="sw s'+i+'"></span>':'').join('')+'</span>';}

/* ---------- Compare tab ---------- */
function slotsHTML(){
  if(!state.sel.length)return '<p class="hint">Pick up to six rhythms below.</p>';
  const big=state.sel.length>3;
  return state.sel.map((id,i)=>'<span class="chip"><span class="sw s'+i+'"></span>'+(big?'<b class="num">'+(i+1)+'</b>':'')+esc(RM[id].name)+
   '<button class="x" data-act="pick" data-arg="'+id+'" aria-label="Remove '+esc(RM[id].short)+'">×</button></span>').join('');
}
function chipsHTML(){
  return R.filter(r=>r.group===state.grp).map(r=>{
    const i=state.sel.indexOf(r.id);
    return '<button class="chip" data-act="pick" data-arg="'+r.id+'" aria-pressed="'+(i>=0)+'">'+(i>=0?'<span class="sw s'+i+'"></span>':'')+esc(r.short)+'</button>';}).join('');
}
function pairsHTML(){
  const s=state.sel;if(s.length<2)return '<p class="hint">Pick a second rhythm to see how the two split apart.</p>';
  const big=s.length>3;let out='';
  if(big)out+='<p class="hint" style="margin:0 0 8px">'+(s.length*(s.length-1)/2)+' pairs. Tap a pair to open it.</p>';
  for(let i=0;i<s.length;i++)for(let j=i+1;j<s.length;j++){
    const a=RM[s[i]],b=RM[s[j]],tip=tipFor(a.id,b.id);
    let rows='';
    CATS.forEach(c=>{
      const ao=[...a.atoms].filter(x=>A[x].cat===c.id&&!b.atoms.has(x)).map(x=>A[x].short);
      const bo=[...b.atoms].filter(x=>A[x].cat===c.id&&!a.atoms.has(x)).map(x=>A[x].short);
      if(ao.length||bo.length)rows+='<tr><td class="k">'+c.label+'</td><td>'+(ao.map(esc).join(' · ')||'<span class="hint">same</span>')+'</td><td>'+(bo.map(esc).join(' · ')||'<span class="hint">same</span>')+'</td></tr>';});
    const body=(tip?'<p class="tip">'+esc(tip)+'</p>':'')+
     '<div class="tbl"><table><thead><tr><th>Check</th><th><span class="sw s'+i+'"></span> '+esc(a.short)+'</th><th><span class="sw s'+j+'"></span> '+esc(b.short)+'</th></tr></thead><tbody>'+(rows||'<tr><td colspan="3">No differences in these checks.</td></tr>')+'</tbody></table></div>';
    if(big){const k='p_'+a.id+'_'+b.id;
      out+='<details class="pair" data-open="'+k+'"'+(state.open.has(k)?' open':'')+'><summary><span class="sw s'+i+'"></span><span class="sw s'+j+'"></span><span class="sum-r">'+esc(a.short)+' vs '+esc(b.short)+'</span>'+(tip?'<span class="tagg">rule</span>':'')+'</summary>'+body+'</details>';}
    else out+='<div class="pair"><h3>'+esc(a.short)+' vs '+esc(b.short)+'</h3>'+body+'</div>';
  }
  return out;
}
function notesHTML(){
  return state.sel.map((id,i)=>{const r=RM[id];
    return '<details data-open="n_'+id+'"'+(state.open.has('n_'+id)?' open':'')+'><summary><span class="sw s'+i+'"></span>'+esc(r.name)+'</summary><p class="hint" style="margin:6px 0 0"><b>Rate:</b> '+esc(r.rateText||'—')+'</p>'+(r.note?'<p class="hint" style="margin:4px 0 0">'+esc(r.note)+'</p>':'')+'<p class="hint" style="margin:4px 0 0">Source: '+esc(r.src)+'</p></details>';}).join('');
}
const drawnCache={};
function drawnSet(n){
  if(n<=3)return null;
  if(!drawnCache[n]){const sp=regionSpots(geom(n,600),600);drawnCache[n]=new Set(Object.keys(sp).map(Number));}
  return drawnCache[n];
}
function compareHTML(){
  const n=state.sel.length,rm=regionMap(),ord=regionOrder(n,rm),dr=drawnSet(n);
  const nd=dr?ord.filter(k=>!dr.has(k)).length:0;
  const regs=ord.map(k=>'<button class="reg'+(dr&&!dr.has(k)?' nd':'')+'" data-act="region" data-arg="'+k+'" aria-pressed="'+(state.region===k)+'">'+dotsFor(k)+esc(rLabel(k))+' <span class="n">'+(rm[k]||[]).length+'</span></button>').join('');
  const cur=state.region,curAtoms=cur?(rm[cur]||[]):[];
  const ov=overlapsOf(state.sel);
  const gsz=R.filter(r=>r.group===state.grp).length;
  const legend=n>3?'<div class="legend">'+state.sel.map((id,i)=>'<span class="lg"><span class="sw s'+i+'"></span><b>'+(i+1)+'</b>'+esc(RM[id].short)+'</span>').join('')+'</div>':'';
  const hint=n>3?'Numbers show how many clues sit in each spot. Tap a spot, or a button below, to read them.'+(nd?' Dashed buttons are overlaps the circles have no room to draw, so they are listed here only.':''):'Tap a region of the diagram, or a button below, to read it in full.';
  return '<div class="card"><p class="lbl">Try a known mix-up</p><div class="row">'+PRESETS.map((p,i)=>'<button class="preset" data-act="preset" data-arg="'+i+'">'+esc(p[0])+'</button>').join('')+'</div></div>'+
  '<div class="card"><div class="bar"><p class="lbl" style="margin:0">Rhythms in the diagram (up to 6)</p>'+(n?'<button class="btn ghost" data-act="clearsel" style="padding:3px 10px">Clear</button>':'')+'</div><div class="row slots" style="margin-top:6px">'+slotsHTML()+'</div>'+
   (n===MAX?'<p class="hint" style="margin-top:6px">Six is the maximum. Picking another replaces the oldest.</p>':'')+
   '<div style="margin-top:12px">'+GROUPS.map(g=>'<button class="grp" data-act="grp" data-arg="'+esc(g)+'" aria-pressed="'+(state.grp===g)+'">'+esc(g)+'</button>').join('')+'</div>'+
   '<div class="row" style="margin-top:8px">'+chipsHTML()+'</div>'+
   '<div style="margin-top:10px"><button class="btn ghost" data-act="grpall" data-arg="'+esc(state.grp)+'">Compare all '+esc(state.grp)+' ('+gsz+')</button></div></div>'+
  '<div class="card"><div class="venn" id="vennbox"></div>'+legend+
   (n?'<p class="hint" style="text-align:center;margin-top:6px">'+hint+'</p>':'')+
   (n?'<div class="regs" style="margin-top:10px">'+regs+'</div>':'')+
   (n&&cur?'<div style="margin-top:12px"><p class="lbl">'+esc(rLabel(cur))+'</p>'+(curAtoms.length?atomList(curAtoms):'<p class="hint">Nothing falls only here. Try another region.</p>')+'</div>':'')+'</div>'+
  (n?'<div class="card ruler"><h2>Rate ruler</h2><div id="rulerbox"></div>'+(ov.length?'<ul class="ovl">'+ov.map(o=>'<li>'+esc(o.text)+'</li>').join('')+'</ul>':'<p class="hint" style="margin:8px 0 0">No overlap between these rate ranges.</p>')+'<p class="hint" style="margin:8px 0 0">Bars are the ranges on your slides. Faded ends are open-ended. Hatched means the rate varies.</p></div>':'')+
  (n?'<div class="card"><h2>Tell them apart</h2>'+pairsHTML()+'</div><div class="card"><h2>Notes and sources</h2>'+notesHTML()+'</div>':'');
}
function drawCompare(){
  const box=document.getElementById('vennbox');if(!box)return;
  const W=Math.max(300,Math.min(720,Math.floor(box.clientWidth||340)));vennW=W;
  box.innerHTML=state.sel.length?vennSVG(state.sel,W,regionMap(),state.region):'<p class="hint" style="padding:30px 0;text-align:center">Pick a rhythm to start.</p>';
  const rb=document.getElementById('rulerbox');if(rb)rb.innerHTML=rulerSVG(state.sel,Math.max(300,Math.min(860,Math.floor(rb.clientWidth||340))));
}

/* ---------- Narrow-down tab ---------- */
function matches(except){
  return R.filter(r=>CATS.every(c=>{if(c.id===except)return true;const s=state.f[c.id];return !s.size||[...s].some(a=>r.atoms.has(a));}));
}
function nextClue(c){
  if(c.length<2)return null;let best=null;
  for(const cat of CATS){
    if(state.f[cat.id].size)continue;
    const rows=[];let bal=0;
    ATOMS.filter(a=>a.cat===cat.id).forEach(a=>{const k=c.filter(r=>r.atoms.has(a.id)).length;
      if(k>0&&k<c.length){rows.push({a,k});bal=Math.max(bal,Math.min(k,c.length-k));}});
    if(bal>0&&(!best||bal>best.bal))best={cat,rows,bal};
  }
  if(best)best.rows.sort((x,y)=>Math.abs(x.k-c.length/2)-Math.abs(y.k-c.length/2));
  return best;
}
function filterChip(a){
  const cat=A[a.id].cat,on=state.f[cat].has(a.id);
  const k=matches(cat).filter(r=>r.atoms.has(a.id)).length;
  return '<button class="chip'+(k===0&&!on?' dim':'')+'" data-act="filt" data-arg="'+a.id+'" aria-pressed="'+on+'">'+esc(a.short)+' <span class="n">'+k+'</span></button>';
}
function narrowHTML(){
  const c=matches(null),nc=nextClue(c);
  const any=CATS.some(x=>state.f[x.id].size);
  let steps='';
  CATS.forEach((cat,i)=>{
    const chips=ATOMS.filter(a=>a.cat===cat.id).map(filterChip).join('');
    if(cat.id==='x')steps+='<details data-open="xclues"'+(state.open.has('xclues')?' open':'')+'><summary>Other clues (optional)</summary><div class="row" style="margin-top:8px">'+chips+'</div></details>';
    else steps+='<div class="step"><h3><b>'+(i+1)+'</b>'+cat.label+'<i>'+cat.q+'</i></h3><div class="row">'+chips+'</div></div>';
  });
  const cards=c.length?GROUPS.map(g=>{const rs=c.filter(r=>r.group===g);if(!rs.length)return '';
    return '<p class="lbl" style="margin-top:10px">'+esc(g)+'</p>'+rs.map(r=>{
      const on=state.sel.includes(r.id);
      const byCat=CATS.map(ct=>{const ids=[...r.atoms].filter(a=>A[a].cat===ct.id);return ids.length?ids:null;}).filter(Boolean).map(ids=>ids.map(a=>'<li>'+pillOf(a)+'<span>'+esc(A[a].long)+'</span></li>').join('')).join('');
      return '<details data-open="r_'+r.id+'"'+(state.open.has('r_'+r.id)?' open':'')+'><summary><span class="sum-r">'+esc(r.name)+' <span class="tagg">'+esc(r.rateText.split(';')[0].split('(')[0].trim()||'')+'</span></span><button class="mini" data-act="pick" data-arg="'+r.id+'" aria-pressed="'+on+'">'+(on?'In Venn':'+ Venn')+'</button></summary><ul class="at">'+byCat+'</ul>'+(r.note?'<p class="hint" style="margin:8px 0 0">'+esc(r.note)+'</p>':'')+'</details>';}).join('');}).join(''):'<p class="hint">No rhythm in your notes has all of these. Clear one filter.</p>';
  return '<div class="card"><div class="bar"><h2 style="margin:0">Narrow it down</h2>'+(any?'<button class="btn ghost" data-act="clear">Clear</button>':'')+'</div><p class="hint" style="margin:6px 0 12px">Tap clues you see on the strip. Within a step, tapping two means either. Numbers show how many rhythms match.</p>'+steps+'</div>'+
  '<div class="card"><div class="bar"><h2 style="margin:0">'+c.length+' of '+R.length+' rhythms match</h2>'+(c.length>=2&&c.length<=6?'<button class="btn ghost" data-act="cmpset" data-arg="x">Compare these '+c.length+'</button>':'')+'<button class="btn" data-act="tab" data-arg="compare">Open Venn ('+state.sel.length+')</button></div>'+
   (nc?'<div class="next" style="margin-top:10px"><p class="lbl" style="color:var(--fg)">Best next check: '+nc.cat.label+'</p><div class="row">'+nc.rows.slice(0,8).map(r=>filterChip(r.a)).join('')+'</div></div>':(c.length>1?'<p class="hint" style="margin-top:8px">Nothing in your notes separates these further.</p>':''))+
   cards+'</div>';
}

/* ---------- Shell ---------- */
function render(){
  const act=document.activeElement,key=act&&act.dataset&&act.dataset.act?act.dataset.act+'|'+(act.dataset.arg||''):null;
  const y=window.scrollY;
  app.innerHTML=
  '<header><div><h1>Rhythm Venn</h1><p class="sub">See which clues up to six rhythms share, and the one check that splits them. Built from your IHCC Fall 2026 EKG files.</p></div>'+
  '<svg class="trace" viewBox="0 0 150 44" aria-hidden="true"><path d="M0 28H26L31 24L36 28H52L57 32L63 4L70 40L75 28H96C100 20 108 20 112 28H150"/></svg></header>'+
  '<div class="steps" aria-label="Five-step method"><span><b>1</b>Regularity</span><span><b>2</b>Rate</span><span><b>3</b>P waves</span><span><b>4</b>PR interval</span><span><b>5</b>QRS</span></div>'+
  '<div class="tabs" role="tablist"><button class="tab" role="tab" data-act="tab" data-arg="compare" aria-selected="'+(state.tab==='compare')+'">Venn</button><button class="tab" role="tab" data-act="tab" data-arg="narrow" aria-selected="'+(state.tab==='narrow')+'">Narrow down</button></div>'+
  (state.tab==='compare'?compareHTML():narrowHTML())+
  '<footer>Sources: Wk 3–12 lecture slides, Wk 4, 8, 9 and 10 notes, the Basic EKG Interpretation Algorithm deck and the EKG Rhythm Graphic. Where they disagree, the lecture slides win and the rhythm card says so. Study aid, not for clinical decisions.</footer>';
  if(state.tab==='compare')drawCompare();
  window.scrollTo(0,y);
  if(key){const el=app.querySelector('[data-act="'+key.split('|')[0]+'"][data-arg="'+(key.split('|')[1]||'')+'"]');if(el)el.focus({preventScroll:true});}
}
app.addEventListener('click',e=>{
  const svg=e.target.closest('#vennbox svg');
  if(svg){
    const b=svg.getBoundingClientRect(),m=maskAt(geom(state.sel.length,vennW).circles,(e.clientX-b.left)*vennW/b.width,(e.clientY-b.top)*vennW/b.width);
    if(m&&(regionMap()[m]||[]).length){state.region=m;render();}
    return;}
  const t=e.target.closest('[data-act]');if(!t)return;
  e.preventDefault();
  const a=t.dataset.act,v=t.dataset.arg;
  if(a==='tab')state.tab=v;
  else if(a==='pick')pick(v);
  else if(a==='grp')state.grp=v;
  else if(a==='region')state.region=+v;
  else if(a==='preset')setSel(PRESETS[+v][1]);
  else if(a==='grpall')setSel(R.filter(r=>r.group===v).map(r=>r.id));
  else if(a==='clearsel'){state.sel=[];state.region=null;}
  else if(a==='cmpset'){setSel(matches(null).map(r=>r.id));state.tab='compare';}
  else if(a==='filt'){const s=state.f[A[v].cat];s.has(v)?s.delete(v):s.add(v);}
  else if(a==='clear')CATS.forEach(c=>state.f[c.id].clear());
  render();
});
app.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.open;if(!k)return;e.target.open?state.open.add(k):state.open.delete(k);},true);
let rt;
new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{const b=document.getElementById('vennbox');
  if(state.tab==='compare'&&b&&Math.abs(Math.min(720,b.clientWidth)-vennW)>4)drawCompare();},120);}).observe(document.body);
ensureRegion();render();
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('500 13px Barlow'),document.fonts.load('700 17px "Barlow Condensed"')]).then(()=>{if(state.tab==='compare')drawCompare();}).catch(()=>{});}
})();
</script>
